name: CI - Release

on:
  push:
    branches:
      - release
    paths-ignore:
      - docs/**
      - '**/*.md'
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
      - .github/PULL_REQUEST_TEMPLATE.md
      - '**/.DS_Store'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-lanes.yml
    with:
      profile: full
